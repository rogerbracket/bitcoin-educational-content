question: Wat is de Verklaring van de Onafhankelijkheid van Cyberspace?
answer: Een tekst die stelt dat cyberspace een afzonderlijk domein is van de fysieke wereld en niet onderworpen moet zijn aan dezelfde wetten.
wrong_answers:
  - Een verklaring dat Bitcoin onafhankelijk is van traditionele financiële systemen.
  - Een tekst die stelt dat cyberspace moet worden gecontroleerd door overheden.
  - Een verklaring die pleit voor de onafhankelijkheid van de piratenbeweging van elke regelgeving.
explanation: |
  De Verklaring van de Onafhankelijkheid van Cyberspace werd in 1996
  geschreven door John Perry Barlow. Dit document stelt
  dat cyberspace een afzonderlijk domein is van de fysieke
  wereld, zodat industriële overheden daar hun
  gezag niet kunnen afdwingen.
reviewed: true
