question: Waarom betalen we fees (transactiekosten) in Bitcoin?
answer: Om een vrije markt te creëren voor het opnemen van transacties in blokken.
wrong_answers:
  - Om uit te leggen hoe je Bitcoin kunt minen.
  - Om rijke mensen meer te laten betalen.
  - Om overheden uitsluiten van het netwerk.
explanation: |
  Fees (transactiekosten) zijn essentieel om een vrije markt te creëren voor het opnemen van transacties in blokken. Een blok heeft namelijk een grootte van 1 MB (die na de SegWit update werd uitgebreid naar 4 MB), dus het aantal transacties dat in een blok kan worden "ingevuld" is beperkt tot een paar duizend transacties per blok.
reviewed: true
