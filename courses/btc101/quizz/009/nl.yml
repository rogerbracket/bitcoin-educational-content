question: Wat is Wei Dai's b-money?
answer: Een idee van een anonieme digitale munt waarbij fraudedetectie wordt uitgevoerd door een gemeenschap van beoordelaars in plaats van een centrale autoriteit.
wrong_answers:
  - Een digitale munt die veel gebruikt werd voor Bitcoin en gecontroleerd werd door een groep cypherpunks.
  - Een vorm van digitaal geld dat is gemaakt door de CIA en wordt gebruikt door het leger.
  - Een digitale munt die door Wei Dai werd gecreëerd als schaalbare concurrent voor Bitcoin.
explanation: |
  Wei Dai's b-money was het idee van een anonieme digitale
  munt zonder centrale entiteit, wat de een grote inspiratiebron vormde voor de creatie van Bitcoin. Het wordt zelfs genoemd in het Bitcoin
  whitepaper.
reviewed: true
