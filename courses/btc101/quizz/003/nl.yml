question: Wat moet er volgens Nobelprijswinnaar F.A Hayek gebeuren om weer goed geld te hebben?
answer: We halen het uit handen van de overheid.
wrong_answers:
  - We geven het aan een betere overheid.
  - We geven het aan een autoritaire overheid.
  - We nemen het handen van het volk.
explanation: |
  Hayek zegt: "Ik geloof niet dat we ooit nog goed geld zullen hebben, voordat we het uit handen van de overheid hebben genomen. Als we het niet met geweld uit handen van de overheid kunnen nemen, dan is het enige wat we kunnen doen op de een of andere slinkse manier iets introduceren wat ze niet kunnen stoppen."
reviewed: true
