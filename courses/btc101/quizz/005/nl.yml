question: Wie zijn de cypherpunks?
answer: Een groep mensen die de rol van privacy en vrijheid in het digitale tijdperk diepgaand begonnen te bevragen.
wrong_answers:
  - Een groep hackers die informatie van overheden stal.
  - Een groep mensen die Bitcoin en andere cryptocurrencies hebben uitgevonden.
  - Een groep mensen die zich verzette tegen het gebruik van technologie.
explanation: |
  De cypherpunks zijn een groep individuen die geloofden
  dat cryptografie kon dienen als hulpmiddel om
  individuele rechten te beschermen tegen de inmenging van overheden
  en grote bedrijven.
reviewed: true
