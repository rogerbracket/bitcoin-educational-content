question: Wat was het DigiCash-project?
answer: Een poging van David Chaum om anoniem elektronisch geld te creëren.
wrong_answers:
  - Een project om een digitale wallet voor Bitcoin te maken.
  - Een poging van de Federal Reserve om al het fysieke geld te digitaliseren.
  - Een project om een cryptocurrency te creëren gebaseerd op Bitcoin.
explanation: |
  In de jaren '80 introduceerde David Chaum het concept van anoniem elektronisch
  geld met zijn project DigiCash.
reviewed: true
