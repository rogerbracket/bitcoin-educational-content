question: Wanneer vond de block size war plaats?
answer: In 2017.
wrong_answers:
  - In 2008.
  - In 2010.
  - In 2019.
explanation: >- De block size war (block size oorlog) vond plaats in 2017. Dit conflict bracht de actor die Bitcoin wilden aanpassen door de blockgrootte te verhogen om de transactiecapaciteit te vergroten, tegenover degenen die de onafhankelijkheid en macht van de gebruikers wilden behouden door de grootte van de blokken op 1 MB te houden. 
reviewed: true
